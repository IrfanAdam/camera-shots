name: DS gate

# Phase 0 Task 6 — the design system certifies itself in CI, not in review.
# Five static checks in `gate`: the committed CSS is provably generated from
# tokens.json, the token gate passes (V/T page + token classes and C1–C6 for
# base.css / components.css / components.js / icons.svg), no doc states a stale
# count, and no fragment link points at an id that does not exist.
# Phase 4 Task 29 adds two accessibility jobs that also block: `a11y-static`
# (WCAG contrast pairs + target sizes, no browser) and `a11y-browser` (axe-core
# 4.10.3 and a keyboard smoke on the gallery specimens, headless Chrome pinned
# by scripts/a11y/package-lock.json). Contract and known debt:
# design-system/accessibility.md.
#
# Static site, no build step: the gate job installs nothing. The browser job is
# the only one with dependencies, scoped to scripts/a11y — there is still no root
# package.json by design (Vercel stays framework: null).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ds-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: tokens, docs, anchors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Byte-stability: render tokens.json in memory and diff it against the
      # committed tokens.css. Fails without writing, so a stale file is visible
      # in the log rather than silently repaired.
      - name: Generated CSS matches tokens.json
        run: node scripts/build-tokens.mjs --check

      # foundations.md is rendered from the same source and asserted against
      # tokens.css, so a token change without a regenerated doc fails here.
      - name: Generated foundations match tokens.json
        run: node scripts/build-foundations.mjs --check

      # V1–V8/U1/T1–T15 judge the four pages and the token set; C1–C6 judge the
      # shared layer (raw values in base.css/components.css, duplicate selectors
      # keyed by cascade scope, aria-modal semantics, a .ds-* class defined
      # twice, svg#id resolution, paint literals in components.js/icons.svg).
      - name: Token + component gate (V/T/C classes)
        run: node scripts/lint-tokens.mjs --check

      - name: Doc counts match the source
        run: node scripts/check-doc-counts.mjs

      - name: Anchors and ids resolve
        run: node scripts/check-anchors.mjs

  a11y-static:
    name: contrast + target sizes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # WCAG 2.2 1.4.3 over the declared role pairs, resolved from the generated
      # tokens.css with the same var() chain the browser uses. Known-failing
      # pairs are enumerated as Task 27 debt and fail if they regress — see
      # design-system/accessibility.md. Exit 0 here is NOT "0 failures".
      - name: Contrast pairs (WCAG 1.4.3)
        run: node scripts/check-contrast.mjs

      # The 40px control floor and its documented [data-ds-compact] dense-row
      # exemption, read from base.css + components.css. Static: no browser, no
      # page edits, no server.
      - name: Target sizes (40px floor, compact exemption)
        run: node scripts/check-targets.mjs

  a11y-browser:
    name: axe + keyboard (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The only dependency in the repo, scoped to the gate: puppeteer 24.15.0
      # and axe-core 4.10.3 exactly (scripts/a11y/package-lock.json). No root
      # package.json, so the site build stays framework: null.
      # No actions/cache on the browser dir: a half-restored Chrome is the one
      # failure mode that reads as a gate bug, and a cold download is ~1 min.
      - name: Install the pinned harness
        run: npm ci --prefix scripts/a11y --no-audit --no-fund

      # Explicit, so a skipped postinstall cannot leave a half-extracted browser
      # behind: the revision is resolved from the locked puppeteer, and this is
      # a no-op when install.mjs already fetched it.
      - name: Install the pinned Chrome for Testing
        working-directory: scripts/a11y
        run: npx --no-install puppeteer browsers install chrome

      # Serves the repo on an ephemeral loopback port (never 5173), fails on any
      # serious/critical violation above scripts/a11y/baseline.json, and refuses
      # to run if a required axe rule is missing from the installed build.
      - name: axe-core over the four surfaces
        run: node scripts/check-axe.mjs

      # Tabs (arrows/Home/End), dialog (focus in, trap, Escape return) and menu
      # (ArrowDown, roving, Escape return) driven with real key events on the
      # gallery specimens; fails on any page JS error.
      - name: Keyboard smoke on the gallery specimens
        run: node scripts/check-keyboard.mjs

  html-validate:
    name: html-validate (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TODO(phase-6): make this job blocking once the four pages pass. Phase 0
    # owns the scripts, not the pages, so the pages are deliberately NOT edited
    # to satisfy the validator — the job reports and the merge is not gated.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A one-shot dev tool fetch, not a runtime dependency: no npm install, no
      # lockfile, no root package.json. Pinned so the advisory noise is stable.
      - name: Validate the four shipped HTML surfaces
        run: >-
          npx --yes html-validate@8.24.1
          index.html pitch.html engine.html design-system/index.html
