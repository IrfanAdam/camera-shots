name: DS gate

# The design system certifies itself in CI, not in review.
#
# Jobs, all blocking:
#   static-docs   — generated CSS/foundations are byte-identical, the token gate
#                   passes, no doc states a stale count, every anchor/id/idref
#                   resolves, and every local href/src + markdown link resolves.
#                   (Phase 0 Task 6 + Phase 6 Task 39.)
#   a11y-static   — WCAG contrast pairs + target sizes, no browser.
#                   (Phase 4 Task 29.)
#   a11y-browser  — axe-core 4.10.3 and a keyboard smoke, headless Chrome pinned
#                   by scripts/a11y/package-lock.json. (Phase 4 Task 29.)
#   html-validate — curated structural HTML rules over the four surfaces.
#                   (Phase 6 Task 39; was advisory, now blocking.)
#   shots         — 12 screenshots (4 pages x 1440/390, both schemes where the
#                   surface declares one), uploaded as artifacts. Fails on a page
#                   JS error, horizontal overflow > 1px, or a blank capture.
#                   (Phase 6 Task 39.)
#
# Contract, disabled-rule list and known debt: design-system/verification.md.
#
# Static site, no build step. Only the three browser-tool jobs install, and they
# install inside scripts/a11y — there is still no root package.json by design
# (Vercel stays framework: null). No job serves :5173; every browser job binds
# an ephemeral loopback port through scripts/a11y/lib/server.mjs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ds-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-docs:
    name: static-docs (tokens, docs, anchors, links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Byte-stability: render tokens.json in memory and diff it against the
      # committed tokens.css. Fails without writing, so a stale file is visible
      # in the log rather than silently repaired.
      - name: Generated CSS matches tokens.json
        run: node scripts/build-tokens.mjs --check

      # foundations.md is rendered from the same source and asserted against
      # tokens.css, so a token change without a regenerated doc fails here.
      - name: Generated foundations match tokens.json
        run: node scripts/build-foundations.mjs --check

      # usage.json/usage.md are the product→DS index: which token each surface
      # consumes, where each component renders, and the zero-product ledgers.
      # The gallery is quarantined (docsOnly) so its refs never count as product
      # usage. Scanned sources come from HEAD, so a lane mid-edit cannot drift
      # it; a committed page/CSS change must regenerate the index and fails here
      # with a per-surface/per-component diff summary when it does not.
      - name: Usage index matches the pages
        run: node scripts/build-usage.mjs --check

      # V1–V8/U1/T1–T15 judge the four pages and the token set; C1–C6 judge the
      # shared layer (raw values in base.css/components.css, duplicate selectors
      # keyed by cascade scope, aria-modal semantics, a .ds-* class defined
      # twice, svg#id resolution, paint literals in components.js/icons.svg).
      - name: Token + component gate (V/T/C classes)
        run: node scripts/lint-tokens.mjs --check

      - name: Doc counts match the source
        run: node scripts/check-doc-counts.mjs

      - name: Anchors and ids resolve
        run: node scripts/check-anchors.mjs

      # Local href/src in the four shipped pages plus relative links in
      # design-system/*.md. Fragments stay with check-anchors; external http(s)
      # is deliberately not fetched (no network flake in CI — see
      # design-system/verification.md § Blind spots).
      - name: Local links resolve
        run: node scripts/check-links.mjs

  a11y-static:
    name: contrast + target sizes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # WCAG 2.2 1.4.3 over the declared role pairs, resolved from the generated
      # tokens.css with the same var() chain the browser uses. Known-failing
      # pairs are enumerated as Task 27 debt and fail if they regress — see
      # design-system/accessibility.md. Exit 0 here is NOT "0 failures".
      - name: Contrast pairs (WCAG 1.4.3)
        run: node scripts/check-contrast.mjs

      # The 40px control floor and its documented [data-ds-compact] dense-row
      # exemption, read from base.css + components.css. Static: no browser, no
      # page edits, no server.
      - name: Target sizes (40px floor, compact exemption)
        run: node scripts/check-targets.mjs

  a11y-browser:
    name: axe + keyboard (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The only dependency tree in the repo, scoped to the gate: puppeteer
      # 24.15.0, axe-core 4.10.3 and html-validate 8.24.1 exactly
      # (scripts/a11y/package-lock.json). No root package.json, so the site
      # build stays framework: null. No actions/cache on the browser dir: a
      # half-restored Chrome is the one failure mode that reads as a gate bug,
      # and a cold download is ~1 min.
      - name: Install the pinned harness
        run: npm ci --prefix scripts/a11y --no-audit --no-fund

      # Explicit, so a skipped postinstall cannot leave a half-extracted browser
      # behind: the revision is resolved from the locked puppeteer, and this is
      # a no-op when install.mjs already fetched it.
      - name: Install the pinned Chrome for Testing
        working-directory: scripts/a11y
        run: npx --no-install puppeteer browsers install chrome

      # Serves the repo on an ephemeral loopback port (never 5173), fails on any
      # serious/critical violation above scripts/a11y/baseline.json, and refuses
      # to run if a required axe rule is missing from the installed build.
      - name: axe-core over the four surfaces
        run: node scripts/check-axe.mjs

      # Tabs (arrows/Home/End), dialog (focus in, trap, Escape return) and menu
      # (ArrowDown, roving, Escape return) driven with real key events on the
      # gallery specimens; fails on any page JS error.
      - name: Keyboard smoke on the gallery specimens
        run: node scripts/check-keyboard.mjs

  html-validate:
    name: html-validate (structural)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # html-validate 8.24.1 is pinned in scripts/a11y (devDependency, in the
      # lockfile). This job needs no browser, so skip the Chrome download.
      - name: Install the pinned validator
        run: npm ci --prefix scripts/a11y --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      # scripts/htmlvalidate.config.json is a curated structural set, NOT
      # html-validate:recommended. Rules the current pages violate
      # (no-inline-style 113, no-implicit-button-type 48, wcag/h63 27,
      # prefer-native-element 15, heading-level 1, element-required-attributes 1,
      # empty-heading 1, unique-landmark 1, aria-label-misuse 1, doctype-style 2)
      # are deliberately NOT enabled: this task owns the gate, not the pages, so
      # they are a documented blind spot in design-system/verification.md rather
      # than a silently green job.
      - name: Validate the four shipped HTML surfaces
        run: >-
          scripts/a11y/node_modules/.bin/html-validate
          --config scripts/htmlvalidate.config.json
          index.html pitch.html engine.html design-system/index.html

      - name: Report the rule set
        run: 'echo "RESULT: PASS — 16 structural rules over 4 pages (scripts/htmlvalidate.config.json)"'

  shots:
    name: screenshots (1440 + 390)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the pinned harness
        run: npm ci --prefix scripts/a11y --no-audit --no-fund

      - name: Install the pinned Chrome for Testing
        working-directory: scripts/a11y
        run: npx --no-install puppeteer browsers install chrome

      # 12 cells: index.html light+dark at 1440 and 390, the gallery light+dark
      # at 1440 and 390, pitch and engine at 1440 and 390. Serves on an
      # ephemeral loopback port through scripts/a11y/lib/server.mjs — never
      # 5173. Fails on a page JS error, horizontal overflow > 1px, or a capture
      # under 5KB (a page that did not paint). Artifact-only: no pixel diff.
      - name: Capture the matrix
        run: node scripts/a11y/check-shots.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds-shots
          path: artifacts/shots
          retention-days: 14
          if-no-files-found: ignore
